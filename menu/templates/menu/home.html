<!DOCTYPE html>
<html>
<head>
    <title>Food Orders</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
     crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="/">FoodOrders</a>
  
  <div class="ms-auto">       
    <a href="{% url 'view_cart' %}" class="btn btn-success">Cart</a>
    <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
  </div>
</nav>

<!-- Hero Banner -->
<div class="bg-light text-center p-5">
  <h1>Order Fresh Food Anytime</h1>
  <p>Fast delivery, best taste, great prices</p>
  <a href="{% url 'menu_list' %}" class="btn btn-warning btn-lg">Shop Now</a>
</div>

<!-- Categories -->
<div class="container mt-5">
  <h2>Categories</h2>
  <div class="row">
    <div class="col-md-3">
      <div class="card">
        <img src="/media/pizza.jpg" class="card-img-top" alt="Pizza">
        <div class="card-body text-center">
          <h5>Pizza</h5>
        </div>
      </div>
    </div>
    <!-- Repeat for Burgers, Drinks, Desserts -->
     <div class="col-md-3">
      <div class="card">
        <img src="/media/burger.jpg" class="card-img-top" alt="burger">
        <div class="card-body text-center">
          <h5>burger</h5>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  <p>&copy; 2026 FoodOrders | Contact us at info@foodorders.com</p>
</footer>

</body>
</html>
